name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      template:
        description: "Expo template: blank = newest SDK, blank@sdk-54 = SDK 54"
        default: "blank"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check the repo has every file we need (fails in seconds instead of after 20 minutes)
        run: |
          missing=0
          for f in App.js index.js app.json assets/icon.png assets/adaptive-icon.png assets/notification-icon.png \
                   widget/render.js widget/task-handler.js widget/FrogsWidget.js widget/data.js widget/logo.js widget/refresh.js \
                   alerts/engine.js alerts/notify.js alerts/background.js config.js prices.js; do
            if [ ! -f "$f" ]; then echo "MISSING FILE IN REPO: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then echo "Upload the missing files (keep the folder names) and run again."; exit 1; fi
      - name: Create Expo project and copy our files in
        run: |
          npx create-expo-app@latest build --template "${{ inputs.template || 'blank' }}" --no-install --yes
          tar --exclude='./.git' --exclude='./.github' --exclude='./build' --exclude='./web' --exclude='./README.md' -cf - . | tar -xf - -C build
          cd build
          npm pkg set main=index.js
          npm install
          npx expo install @react-navigation/native @react-navigation/bottom-tabs react-native-screens react-native-safe-area-context @react-native-async-storage/async-storage expo-status-bar react-native-android-widget expo-notifications expo-task-manager expo-background-task expo-clipboard
      - name: Quick JavaScript check (catches import mistakes in about a minute, before the long build)
        working-directory: build
        run: npx expo export --platform android --output-dir /tmp/js-check
      - name: Prebuild native Android project
        working-directory: build
        run: npx expo prebuild --platform android --no-install
      - name: Keep WorkManager classes (fixes widget crash on launch)
        working-directory: build/android
        run: |
          printf '\nandroid.enableProguardInReleaseBuilds=false\nandroid.enableMinifyInReleaseBuilds=false\nandroid.enableShrinkResourcesInReleaseBuilds=false\n' >> gradle.properties
          printf '\n-keep class androidx.work.** { *; }\n-keep class * extends androidx.room.RoomDatabase { *; }\n-dontwarn androidx.work.**\n' >> app/proguard-rules.pro
      - name: Build APK
        working-directory: build/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: frog-labs-apk
          path: build/android/app/build/outputs/apk/release/*.apk
