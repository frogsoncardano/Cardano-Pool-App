name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Expo project and copy our files in
        run: |
          npx create-expo-app@latest build --template blank --no-install --yes
          cp App.js index.js app.json build/
          mkdir -p build/assets && cp -r assets/. build/assets/
          cp -r widget build/widget
          cd build
          npm pkg set main=index.js
          npm install
          npx expo install @react-navigation/native @react-navigation/bottom-tabs react-native-screens react-native-safe-area-context @react-native-async-storage/async-storage expo-status-bar
          npm install react-native-android-widget
      - name: Prebuild native Android project
        working-directory: build
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: build/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: frogs-cardano-apk
          path: build/android/app/build/outputs/apk/release/*.apk
