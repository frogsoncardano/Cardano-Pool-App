name: Deploy web app (wallet actions)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['web/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test (builds real transactions with a fake wallet and checks what they contain)
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      # a copy you can also upload by hand to Netlify / Cloudflare Pages if GitHub Pages is not available
      - uses: actions/upload-artifact@v4
        with:
          name: frog-labs-web
          path: web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
